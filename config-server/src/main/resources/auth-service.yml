# ============================================================
#  auth-service configuration
#  Database  : PostgreSQL
#  Messaging : Kafka (Producer + Consumer)
#  Produces  : user.registered
#  Consumes  : student.admitted, staff.hired
# ============================================================

server:
  port: 8081

spring:
  application:
    name: auth-service

  # ── PostgreSQL DataSource ──────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${AUTH_POSTGRES_DB:auth_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ── Kafka ─────────────────────────────────────────────────
  kafka:
    producer:
      topics:
        user-registered: user.registered      # ← publishes this

    consumer:
      topics:
        student-admitted: student.admitted    # ← listens to this
        staff-hired: staff.hired              # ← listens to this
      group-id: auth-group

  # ── Mail ──────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── JWT ───────────────────────────────────────────────────
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS}
  magic-link-expiration-ms: ${JWT_MAGIC_LINK_EXPIRATION_TOKEN_MS}

# ── Firebase ──────────────────────────────────────────────
firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  private-key-id: ${FIREBASE_PRIVATE_KEY_ID}
  private-key: ${FIREBASE_PRIVATE_KEY}
  client-email: ${FIREBASE_CLIENT_EMAIL}
  client-id: ${FIREBASE_CLIENT_ID}

# ── Resend ──────────────────────────────────────────────
resend:
  api-token: ${RESEND_API_TOKEN}
  from-email: ${MAIL_FROM}
  from-name: ${MAIL_FROM_NAME}

# ── API ───────────────────────────────────────────────────
api:
  version: ${API_VERSION}

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    com.ecol.authService: INFO
    org.springframework.security: INFO
    org.springframework.kafka: INFO