# ============================================================
#  CONFIG SERVER
#  Central configuration server for all 12 SMS microservices
#  Uses native filesystem (classpath) to serve configs
# ============================================================

server:
  port: 8888

spring:
  application:
    name: config-server

  # ── Native Config Source ──────────────────────────────
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/
        # ── Fail fast if config cannot be served ────────
        default-label: main

    # ── Spring Cloud Bus ────────────────────────────────
    bus:
      enabled: true
      destination: springCloudBus

  # ── Kafka (for Spring Cloud Bus) ──────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

# ── Eureka Discovery ──────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka}@discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ── Actuator & Prometheus ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, busrefresh, refresh
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.config: INFO
    org.springframework.cloud.bus: INFO
    org.springframework.kafka: INFO