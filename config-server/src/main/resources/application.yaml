# ============================================================
#  SHARED CONFIGURATION
#  Inherited by ALL 12 microservices automatically
#  when they contact the config server
# ============================================================

# ── Eureka Discovery ──────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka}@discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ── Spring (Kafka + Redis + Cloud) ───────────────────────

  # ── Kafka ───────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.ecol.*"

    listener:
      ack-mode: manual_immediate

  # ── Redis ───────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 1000ms
        shutdown-timeout: 200ms

  # ── Spring Cloud Bus (Kafka) ─────────────────────────────
  cloud:
    bus:
      enabled: true
      destination: springCloudBus

# ── Auth-Service Kafka Topics ────────────────────────────
# NOTE: These are NOT under spring.kafka — they are custom
# properties injected via @Value("${kafka.topics.*}")
kafka:
  topics:
    user-registered: auth.user.registered
    user-login: auth.user.login
    user-logout: auth.user.logout
    otp-events: auth.otp.events
    password-events: auth.password.events
    account-status: auth.account.status
    magiclink-events: auth.magiclink.events
    google-login: auth.google.login
    security-alerts: auth.security.alerts
    audit-events: auth.audit.events

# ── Actuator & Prometheus ────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, busrefresh
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# ── API Version ──────────────────────────────────────────
api:
  version: ${API_VERSION:v1}

# ── Shared Logging ────────────────────────────────────────
logging:
  level:
    org.springframework.cloud: INFO
    org.springframework.kafka: INFO
    com.ecol: INFO

# ── SpringDoc / Swagger ──────────────────────────────────
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
  show-actuator: false
  packages-to-scan: com.ecol