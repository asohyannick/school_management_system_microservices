# ============================================================
#  studentprofile-service configuration
#  Database  : MySQL
#  Storage   : MinIO
#  Messaging : Kafka (Producer + Consumer)
#  Produces  : profile.created
#  Consumes  : student.admitted
# ============================================================

server:
  port: 8091

spring:
  application:
    name: studentprofile-service

  # ── MySQL DataSource ───────────────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${STUDENT_PROFILE_MYSQL_DB:studentprofile_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ── Kafka ─────────────────────────────────────────────────
  kafka:
    producer:
      topics:
        profile-created: profile.created      # ← publishes this

    consumer:
      topics:
        student-admitted: student.admitted    # ← listens to this
      group-id: studentprofile-group

# ── MinIO Object Storage ──────────────────────────────────
minio:
  url: ${MINIO_URL:http://localhost:9000}
  username: ${MINIO_USERNAME}
  password: ${MINIO_PASSWORD}
  bucket: ${MINIO_BUCKET_REVIEWS}

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    com.ecol.studentProfileService: INFO
    org.springframework.kafka: INFO