# ============================================================
#  quiz-service configuration
#  Database  : MySQL
#  Storage   : MinIO
#  Messaging : Kafka (Producer + Consumer)
#  Produces  : quiz.submitted
#  Consumes  : student.enrolled
# ============================================================

server:
  port: 8086

spring:
  application:
    name: quiz-service

  # ── MySQL DataSource ───────────────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${QUIZ_MYSQL_DB:quiz_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ── Kafka ─────────────────────────────────────────────────
  kafka:
    producer:
      topics:
        quiz-submitted: quiz.submitted        # ← publishes this

    consumer:
      topics:
        student-enrolled: student.enrolled    # ← listens to this
      group-id: quiz-group

# ── MinIO Object Storage ──────────────────────────────────
minio:
  url: ${MINIO_URL:http://localhost:9000}
  username: ${MINIO_USERNAME}
  password: ${MINIO_PASSWORD}
  bucket: ${MINIO_BUCKET_REVIEWS}

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    com.ecol.quizService: INFO
    org.springframework.kafka: INFO