# ============================================================
#  human-resource-service configuration
#  Database  : PostgreSQL
#  Storage   : MinIO
#  Messaging : Kafka (Producer only)
#  Produces  : staff.hired
# ============================================================

server:
  port: 8088

spring:
  application:
    name: human-resource-service

  # ── PostgreSQL DataSource ──────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${HR_POSTGRES_DB:hr_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ── Kafka Producer ────────────────────────────────────────
  kafka:
    producer:
      topics:
        staff-hired: staff.hired              # ← publishes this

# ── MinIO Object Storage ──────────────────────────────────
minio:
  url: ${MINIO_URL:http://localhost:9000}
  username: ${MINIO_USERNAME}
  password: ${MINIO_PASSWORD}
  bucket: ${MINIO_BUCKET_REVIEWS}

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    com.ecol.humanResource: INFO
    org.springframework.kafka: INFO