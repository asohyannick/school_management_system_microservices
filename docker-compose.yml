# ============================================================
#  Shared env files — applied to all app services
#  .env        → values for running services from IntelliJ (localhost)
#  .env.docker → overrides for inside the Docker network (service names)
#  Later files win, so .env.docker overrides .env.
# ============================================================
x-common-env: &common-env
  env_file:
    - .env
    - .env.docker

networks:
  sms-network:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:
  mongodb-data:
  redis-data:
  kafka-data:
  minio-data:
  grafana-data:

services:

  # ============================================================
  #  PostgreSQL
  #  Serves: keycloak, auth-service, admission-service,
  #          payment-service, human-resource-service, notification-service
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by 02-keycloak.sh to create Keycloak's own database + user
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/02-keycloak.sh:/docker-entrypoint-initdb.d/02-keycloak.sh:ro
    networks:
      - sms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  MySQL
  #  Serves: course-service, assignment-service, quiz-service,
  #          inventory-service, staffprofile-service,
  #          studentprofile-service, attendance-service
  # ============================================================
  mysql:
    image: mysql:8.3
    container_name: sms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${COURSE_MYSQL_DB}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  MongoDB
  #  Serves: review-service
  # ============================================================
  mongodb:
    image: mongo:7-jammy
    container_name: sms-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  Redis — API Gateway rate limiting
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: sms-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  #  Kafka — KRaft mode (no ZooKeeper)
  #  Single node acting as both broker and controller.
  #
  #  Listeners:
  #    PLAINTEXT      kafka:29092        → containers on sms-network
  #    PLAINTEXT_HOST localhost:KAFKA_PORT → apps run from IntelliJ
  #    CONTROLLER     kafka:29093        → KRaft quorum (internal only)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:8.0.0
    container_name: sms-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker → replication factor 1 everywhere
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sms-network
    healthcheck:
      # Uses the internal listener, so it doesn't depend on KAFKA_PORT
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ============================================================
  #  MinIO — S3-compatible object storage
  #  API:     http://localhost:${MINIO_PORT}
  #  Console: http://localhost:${MINIO_CONSOLE_PORT}
  #
  #  Upstream stopped publishing images (Oct 2025) — the tag below is
  #  the last official one. Swap MINIO_IMAGE in .env for a maintained
  #  build (e.g. a community fork) without touching this file.
  # ============================================================
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: sms-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_REGION: ${MINIO_REGION}
    volumes:
      - minio-data:/data
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  #  MinIO init — one-shot job
  #  Creates the bucket, a least-privilege policy and the service
  #  account the microservices use (they never get root creds).
  #  Idempotent: safe to run on every `docker compose up`.
  # ============================================================
  minio-init:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: sms-minio-init
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - sms-network
    restart: "no"

  # ============================================================
  #  Keycloak — the ONLY identity provider
  #  Admin console: http://localhost:${KEYCLOAK_PORT}
  #
  #  KC_HOSTNAME is fixed to the browser-facing URL, so every token's
  #  "iss" is http://localhost:${KEYCLOAK_PORT}/realms/<realm>, no matter
  #  whether it was requested from the browser or from inside Docker.
  #  Containers still reach Keycloak at http://keycloak:8080
  #  (BACKCHANNEL_DYNAMIC) to fetch keys and call the Admin API.
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: sms-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap admin of the *master* realm (console login only)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Substituted into docker/keycloak/realm-sms.json at import time
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE}
      FRONTEND_URL: ${FRONTEND_URL}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL}
      SMS_BOOTSTRAP_ADMIN_EMAIL: ${SMS_BOOTSTRAP_ADMIN_EMAIL}
      SMS_BOOTSTRAP_ADMIN_PASSWORD: ${SMS_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./docker/keycloak/realm-sms.json:/opt/keycloak/data/import/realm-sms.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sms-network
    healthcheck:
      # Image has no curl/wget; health lives on the management port 9000
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ============================================================
  #  Discovery Server — starts first, depends on nothing
  # ============================================================
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: sms-discovery-server
    <<: *common-env
    ports:
      - "${DISCOVERY_SERVER_PORT}:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ============================================================
  #  Config Server — starts after discovery + kafka
  #  (build context + Dockerfile updated in the next step)
  # ============================================================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: sms-config-server
    <<: *common-env
    ports:
      - "${CONFIG_SERVER_PORT}:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      SERVER_PORT: 8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      API_VERSION: ${API_VERSION}
    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ============================================================
  #  API Gateway — validates Keycloak JWTs on every request
  # ============================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sms-api-gateway
    <<: *common-env
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ============================================================
  #  auth-service — PostgreSQL + Kafka + Keycloak Admin API
  # ============================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: sms-auth-service
    <<: *common-env
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  admission-service — PostgreSQL + Kafka + MinIO
  # ============================================================
  admission-service:
    build:
      context: ./admission-service
      dockerfile: Dockerfile
    container_name: sms-admission-service
    <<: *common-env
    ports:
      - "${ADMISSION_SERVICE_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sms-network

  # ============================================================
  #  course-service — MySQL + Kafka + MinIO
  # ============================================================
  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: sms-course-service
    <<: *common-env
    ports:
      - "${COURSE_SERVICE_PORT}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sms-network

  # ============================================================
  #  assignment-service — MySQL + Kafka
  # ============================================================
  assignment-service:
    build:
      context: ./assignment-service
      dockerfile: Dockerfile
    container_name: sms-assignment-service
    <<: *common-env
    ports:
      - "${ASSIGNMENT_SERVICE_PORT}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  payment-service — PostgreSQL + Kafka
  # ============================================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: sms-payment-service
    <<: *common-env
    ports:
      - "${PAYMENT_SERVICE_PORT}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  notification-service — PostgreSQL + Kafka
  # ============================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: sms-notification-service
    <<: *common-env
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8092
      EUREKA_APP_NAME: notification-service
      EUREKA_INSTANCE_HOST: notification-service
      EUREKA_HOST: discovery-server
      EUREKA_PORT: 8761
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  quiz-service — MySQL + Kafka + MinIO
  # ============================================================
  quiz-service:
    build:
      context: ./quiz-service
      dockerfile: Dockerfile
    container_name: sms-quiz-service
    <<: *common-env
    ports:
      - "${QUIZ_SERVICE_PORT}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sms-network

  # ============================================================
  #  inventory-service — MySQL + Kafka + MinIO
  # ============================================================
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: sms-inventory-service
    <<: *common-env
    ports:
      - "${INVENTORY_SERVICE_PORT}:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sms-network

  # ============================================================
  #  human-resource-service — PostgreSQL + Kafka + MinIO
  # ============================================================
  human-resource-service:
    build:
      context: ./human-resource-service
      dockerfile: Dockerfile
    container_name: sms-human-resource-service
    <<: *common-env
    ports:
      - "${HUMAN_RESOURCE_SERVICE_PORT}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sms-network

  # ============================================================
  #  review-service — MongoDB + Kafka + MinIO
  # ============================================================
  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: sms-review-service
    <<: *common-env
    ports:
      - "${REVIEW_SERVICE_PORT}:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sms-network

  # ============================================================
  #  staffprofile-service — MySQL + Kafka + MinIO
  # ============================================================
  staffprofile-service:
    build:
      context: ./staffProfile-service
      dockerfile: Dockerfile
    container_name: sms-staffprofile-service
    <<: *common-env
    ports:
      - "${STAFF_PROFILE_SERVICE_PORT}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sms-network

  # ============================================================
  #  studentprofile-service — MySQL + Kafka + MinIO
  # ============================================================
  studentprofile-service:
    build:
      context: ./studentProfile-service
      dockerfile: Dockerfile
    container_name: sms-studentprofile-service
    <<: *common-env
    ports:
      - "${STUDENT_PROFILE_SERVICE_PORT}:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sms-network

  # ============================================================
  #  attendance-service — MySQL + Kafka
  # ============================================================
  attendance-service:
    build:
      context: ./attendance-service
      dockerfile: Dockerfile
    container_name: sms-attendance-service
    <<: *common-env
    ports:
      - "${ATTENDANCE_SERVICE_PORT}:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sms-network

  # ============================================================
  #  Prometheus — Metrics Collection
  #  UI: http://localhost:9090
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - sms-network
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  #  Grafana — Metrics Visualization
  #  UI: http://localhost:3000
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: sms-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - sms-network